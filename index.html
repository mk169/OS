<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta
      name="description"
      content="Dein persönliches Betriebssystem für Studium und Projekte: Todos, Kalender, Habits, Projekte, Fokus-Perioden und Wochenrückblick – offline nutzbar, Daten bleiben auf deinem Gerät."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS unterstützt für apple-touch-icon kein SVG: ohne PNG nimmt
         „Zum Home-Bildschirm" einen Screenshot der Seite statt des Icons. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />

    <!-- Wie der Link aussieht, wenn jemand ihn teilt. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OS – persönliches Betriebssystem" />
    <meta
      property="og:description"
      content="Todos, Kalender, Habits, Projekte, Fokus-Perioden und Wochenrückblick in einer Oberfläche. Offline nutzbar, Daten bleiben auf dem Gerät."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Dekorative Fonts für die Startseiten-Stile (Arcade, Clean Girl) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OS" />
    <title>OS – persönliches Betriebssystem</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Diese App braucht JavaScript. Aktiviere es, um OS zu benutzen – deine
      Daten bleiben dabei auf deinem Gerät.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
